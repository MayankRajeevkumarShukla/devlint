name: DevLint Check

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

jobs:
  devlint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install DevLint
        run: |
          pip install git+https://github.com/MayankRajeevkumarShukla/devlint.git
      
      - name: Run DevLint - Secret Scan
        id: secrets
        run: |
          echo "Scanning all files for secrets..."
          
          # Find all code files and scan them
          SECRET_FOUND=0
          
          # Scan for AWS keys
          if grep -r "AKIA[0-9A-Z]\{16\}" --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.java" --include="*.go" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "❌ AWS Access Key detected!"
            SECRET_FOUND=1
          fi
          
          # Scan for GitHub tokens
          if grep -rE "gh[ps]_[0-9a-zA-Z]{36}" --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.java" --include="*.go" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "❌ GitHub Token detected!"
            SECRET_FOUND=1
          fi
          
          # Scan for Stripe keys
          if grep -rE "sk_(live|test)_[0-9a-zA-Z]{24,}" --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.java" --include="*.go" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "❌ Stripe API Key detected!"
            SECRET_FOUND=1
          fi
          
          # Scan for OpenAI keys
          if grep -rE "sk-[A-Za-z0-9]{48}" --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.java" --include="*.go" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "❌ OpenAI API Key detected!"
            SECRET_FOUND=1
          fi
          
          # Scan for private keys
          if grep -r "BEGIN.*PRIVATE KEY" --include="*.py" --include="*.js" --include="*.ts" --include="*.pem" --include="*.key" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "❌ Private Key detected!"
            SECRET_FOUND=1
          fi
          
          # Scan for hardcoded passwords/tokens in code
          if grep -rE "(password|passwd|pwd|secret|token|api_key|apikey).*=.*['\"][a-zA-Z0-9_\-]{15,}['\"]" --include="*.py" --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" --include="*.java" --include="*.go" --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir=".venv" . ; then
            echo "⚠️  Potential hardcoded secret detected!"
            SECRET_FOUND=1
          fi
          
          if [ $SECRET_FOUND -eq 1 ]; then
            echo "secrets_passed=false" >> $GITHUB_OUTPUT
            echo ""
            echo "🚨 SECRETS DETECTED! This PR is blocked."
            exit 1
          else
            echo "secrets_passed=true" >> $GITHUB_OUTPUT
            echo "✅ No secrets detected"
          fi
      
      - name: Run DevLint - PR Safety Check
        if: github.event_name == 'pull_request'
        id: pr_check
        continue-on-error: true
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          
          if devlint check-pr "$BRANCH_NAME"; then
            echo "pr_check_passed=true" >> $GITHUB_OUTPUT
          else
            echo "pr_check_passed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🚨 DevLint Check Failed
            
            **Secret Scan:** ${{ steps.secrets.outputs.secrets_passed == 'true' && '✅ Passed' || '❌ Failed - Secrets detected!' }}
            **PR Safety:** ${{ steps.pr_check.outputs.pr_check_passed == 'true' && '✅ Passed' || '⚠️ Warning - Review needed' }}
            
            ### ⚠️ Action Required
            
            Secrets were detected in your code. Please:
            1. Remove all secrets from your code
            2. Use environment variables instead
            3. Add sensitive files to \`.gitignore\`
            4. Run \`devlint secrets\` locally to check
            
            **DO NOT MERGE until secrets are removed!**
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
