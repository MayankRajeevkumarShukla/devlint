[project]
name = "devlint"
version = "0.1.0"
description = "A CLI tool that prevents common developer workflow mistakes"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
dependencies = [
    "gitpython>=3.1.40",
    "click>=8.1.7",
    "psutil>=5.9.6",
    "docker>=7.0.0",
    "pygithub>=2.1.1",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
]

[project.scripts]
devlint = "devlint.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devlint"]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
]